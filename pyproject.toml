[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wage-etl"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.14.2",
    "pandas>=2.3.3",
    "psycopg2-binary>=2.9.11",
    "pydantic>=2.12.4",
    "pydantic-settings[yaml]>=2.12.0",
    "python-dotenv>=1.2.1",
    "pyyaml>=6.0.3",
    "requests>=2.32.5",
]

[dependency-groups]
dev = [
    "coverage>=7.13.0",
    "pylint>=4.0.4",
    "pytest>=9.0.2",
    "ruff>=0.14.0",
]

[project.scripts]
wage-etl = "wage_etl.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wage_etl"]

# pytest configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
# addopts = ["--disable-warnings", "-q"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["wage_etl"]
omit = ["tests/*", "sql/*", "data/*", "logs/*"]

[tool.coverage.report]
show_missing = true
precision = 2

[tool.coverage.html]
directory = "htmlcov"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
